name: Trading Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"        # refresh_prices (Aktien + Krypto-Monitor)
    - cron: "2,32 * * * *"       # market_analysis (2 Min nach jeder halben Stunde, versetzt zu refresh_prices)
    - cron: "7 */2 * * *"        # llm_analysis (7 Min nach jeder geraden Stunde)
    - cron: "12 5,8,11,14,17,20 * * *"  # portfolio_report (12 Min nach der vollen Stunde, versetzt zu llm_analysis)
    - cron: "47 22 * * *"        # daily_summary
  workflow_dispatch:

jobs:
  refresh_prices:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Refresh prices
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 90 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/refresh_prices" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
      - name: Crypto position monitor (SL/TP/Liquidation, 24/7)
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 60 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/crypto_monitor" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
      - name: OKX Spot position monitor (SL/TP/Trailing, ECHTES GELD, 24/7)
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 60 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/okx_spot_monitor" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail

  market_analysis:
    runs-on: ubuntu-latest
    if: github.event.schedule == '2,32 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Market analysis
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 260 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/market_analysis" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
      - name: Real positions urgent alert
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 260 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/real_positions_alert" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail

  llm_analysis:
    runs-on: ubuntu-latest
    if: github.event.schedule == '7 */2 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: LLM analysis + auto-trade
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 120 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/llm_analysis?auto_trade=true" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
      - name: Crypto analysis + auto-trade (nur 07-23 Uhr, Backend prueft Fenster)
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 120 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/crypto_analysis?auto_trade=true" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
      - name: OKX Spot Auto-Trade (ECHTES GELD, kein Hebel)
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 120 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/okx_spot_auto_trade" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail

  portfolio_report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '12 5,8,11,14,17,20 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Portfolio report
        continue-on-error: true
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 260 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/portfolio_report" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail

  daily_summary:
    runs-on: ubuntu-latest
    if: github.event.schedule == '47 22 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Daily summary
        env:
          SCHED: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          curl -X POST \
            --max-time 260 \
            "https://trading-dashboard-6n5w.onrender.com/api/scheduler/daily_summary" \
            -H "Authorization: Bearer $SCHED" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail
