services:
  - type: web
    name: trading-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 240 --workers 1"
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: false
      - key: FLASK_SECRET_KEY
        generateValue: false
        value: ""  # Setze hier einen festen Wert via Render-Dashboard, damit Sessions nach Deploys gültig bleiben
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER_DISK_PATH
        value: /data
      - key: SCHEDULER_API_KEY
        sync: false
    disk:
      name: trading-data
      mountPath: /data
      sizeGB: 0.5
