services:
  - type: web
    name: trading-dashboard
    runtime: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_SECRET
        generateValue: true
    autoDeploy: true
