services:
  - type: web
    name: trading-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: false
      - key: FLASK_SECRET_KEY
        generateValue: false
        value: ""  # Setze hier einen festen Wert via Render-Dashboard, damit Sessions nach Deploys gültig bleiben
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER_DISK_PATH
        value: /data
      - key: SCHEDULER_API_KEY
        sync: false
    disk:
      name: trading-data
      mountPath: /data
      sizeGB: 0.5

  # --- Render Cron Jobs: ersetzen GitHub Actions als Scheduler-Trigger ---
  # Render triggert diese Endpunkte direkt (kein externer Bearer-Header-Umweg über
  # GitHub Secrets, kein Risiko von GitHub-Cron-Verzoegerungen). Jeder Cron-Job startet
  # kurz eine Instanz, ruft den Endpunkt per curl auf und beendet sich wieder.
  - type: cron
    name: cron-refresh-prices
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 90
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/refresh_prices"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false

  - type: cron
    name: cron-crypto-monitor
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 60
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/crypto_monitor"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false

  - type: cron
    name: cron-market-analysis
    runtime: python
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 140
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/market_analysis"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
      && curl -X POST --max-time 140
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/real_positions_alert"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false

  - type: cron
    name: cron-llm-crypto-analysis
    runtime: python
    plan: starter
    schedule: "0 */2 * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 120
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/llm_analysis?auto_trade=true"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
      && curl -X POST --max-time 120
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/crypto_analysis?auto_trade=true"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false

  - type: cron
    name: cron-portfolio-report
    runtime: python
    plan: starter
    schedule: "0 5,8,11,14,17,20 * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 140
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/portfolio_report"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false

  - type: cron
    name: cron-daily-summary
    runtime: python
    plan: starter
    schedule: "15 22 * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -X POST --max-time 140
      "https://trading-dashboard-6n5w.onrender.com/api/scheduler/daily_summary"
      -H "Authorization: Bearer $SCHEDULER_API_KEY"
      -H "Content-Type: application/json"
      --silent --show-error --fail
    envVars:
      - key: SCHEDULER_API_KEY
        sync: false
