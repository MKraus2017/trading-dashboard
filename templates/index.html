<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .timestamp { color: #8b949e; font-size: 13px; }
  .refresh-btn { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: #30363d; }
  .logout-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
  .logout-btn:hover { border-color: #f85149; color: #f85149; }
  .tabs { display: flex; gap: 4px; padding: 16px 24px 0; background: #161b22; border-bottom: 1px solid #30363d; }
  .tab { padding: 8px 20px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; color: #8b949e; border: 1px solid transparent; }
  .tab.active { background: #0d1117; color: #e6edf3; border-color: #30363d; border-bottom-color: #0d1117; }
  .tab:hover:not(.active) { color: #e6edf3; }
  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card-label { color: #8b949e; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 24px; font-weight: 600; }
  .card-value.green { color: #3fb950; }
  .card-value.red { color: #f85149; }
  .card-value.neutral { color: #e6edf3; }
  .section-title { font-size: 16px; font-weight: 600; margin: 24px 0 12px; color: #e6edf3; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  th { background: #21262d; color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px; text-align: left; }
  td { padding: 10px 14px; font-size: 13px; border-top: 1px solid #21262d; }
  tr:hover td { background: #1c2129; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge.long { background: #1a3a2a; color: #3fb950; }
  .badge.short { background: #3a1a1a; color: #f85149; }
  .badge.buy { background: #1a3a2a; color: #3fb950; }
  .badge.sell { background: #3a1a1a; color: #f85149; }
  .pnl-pos { color: #3fb950; }
  .pnl-neg { color: #f85149; }
  .loading { text-align: center; padding: 60px; color: #8b949e; }
  .error { background: #2d1117; border: 1px solid #f85149; border-radius: 8px; padding: 16px; color: #f85149; margin: 16px 0; }
  .no-data { color: #8b949e; font-style: italic; font-size: 14px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Trading Dashboard</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="timestamp" id="last-update">Lade...</span>
    <button class="refresh-btn" onclick="loadData()">⟳ Aktualisieren</button>
    <a href="/logout" class="logout-btn">⎋ Logout</a>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('okx')">🔷 OKX Virtuell (Hebel)</div>
  <div class="tab" onclick="showTab('tr-virt')">📈 Trade Republic Virtuell</div>
  <div class="tab" onclick="showTab('tr-real')">🏦 Trade Republic Real</div>
</div>

<div class="content">
  <div id="loading" class="loading">⏳ Lade Daten...</div>
  <div id="error" class="error" style="display:none"></div>

  <!-- OKX Virtuell -->
  <div class="panel active" id="panel-okx">
    <div class="summary-grid" id="okx-summary"></div>
    <div class="section-title">📂 Offene Positionen</div>
    <div id="okx-positions"></div>
    <div class="section-title">📋 Trade-Historie</div>
    <div id="okx-trades"></div>
  </div>

  <!-- TR Virtuell -->
  <div class="panel" id="panel-tr-virt">
    <div class="summary-grid" id="tr-virt-summary"></div>
    <div class="section-title">📂 Positionen</div>
    <div id="tr-virt-positions"></div>
    <div class="section-title">📋 Transaktionen</div>
    <div id="tr-virt-trades"></div>
  </div>

  <!-- TR Real -->
  <div class="panel" id="panel-tr-real">
    <div class="summary-grid" id="tr-real-summary"></div>
    <div class="section-title">📂 Positionen</div>
    <div id="tr-real-positions"></div>
  </div>
</div>

<script>
let currentData = null;

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['okx','tr-virt','tr-real'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

function pnlClass(v) { return v >= 0 ? 'pnl-pos' : 'pnl-neg'; }
function pnlSign(v) { return v >= 0 ? '+' : ''; }
function eur(v) { return (v !== null && v !== undefined) ? '€' + Number(v).toFixed(2) : '—'; }
function pct(v) { return (v !== null && v !== undefined) ? pnlSign(v) + Number(v).toFixed(2) + '%' : '—'; }

function card(label, value, cls='neutral') {
  return `<div class="card"><div class="card-label">${label}</div><div class="card-value ${cls}">${value}</div></div>`;
}

function renderOKX(d) {
  const okx = d.okx_virtuell;
  if (!okx) { document.getElementById('okx-summary').innerHTML = '<div class="no-data">Keine OKX-Daten</div>'; return; }

  const positions = [];
  let totalPnl = 0, totalMargin = 0;

  for (const [sym, posList] of Object.entries(okx.positions || {})) {
    for (const pos of posList) {
      if (pos.status !== 'open') continue;
      const live = d.live_prices && d.live_prices[sym] ? d.live_prices[sym] : pos.entry_price;
      const pnl = (live - pos.entry_price) * pos.quantity;
      const pnlPct = ((live - pos.entry_price) / pos.entry_price) * 100 * pos.leverage;
      totalPnl += pnl;
      totalMargin += pos.margin;
      positions.push({ sym, pos, live, pnl, pnlPct });
    }
  }

  const cash = okx.cash || 0;
  const start = okx.start_capital || 1000;
  const depotVal = cash + totalMargin + totalPnl;
  const depotPnl = depotVal - start;
  const depotPct = (depotPnl / start) * 100;

  document.getElementById('okx-summary').innerHTML =
    card('Depot-Wert', eur(depotVal), depotPnl >= 0 ? 'green' : 'red') +
    card('Gesamt P&L', pnlSign(depotPnl) + eur(depotPnl) + ' (' + pct(depotPct) + ')', depotPnl >= 0 ? 'green' : 'red') +
    card('Cash', eur(cash)) +
    card('Offene Pos.', positions.length) +
    card('Startkapital', eur(start));

  if (positions.length === 0) {
    document.getElementById('okx-positions').innerHTML = '<div class="no-data">Keine offenen Positionen</div>';
  } else {
    let rows = positions.map(({sym, pos, live, pnl, pnlPct}) => `
      <tr>
        <td>${sym}</td>
        <td><span class="badge ${pos.action==='BUY'?'long':'short'}">${pos.action==='BUY'?'🔼 LONG':'🔽 SHORT'}</span></td>
        <td>${pos.leverage}x</td>
        <td>${eur(pos.entry_price)}</td>
        <td>${eur(live)}</td>
        <td>${pos.quantity.toFixed(4)}</td>
        <td>${eur(pos.margin)}</td>
        <td>${eur(pos.exposure)}</td>
        <td class="${pnlClass(pnl)}">${pnlSign(pnl)}${eur(pnl)}</td>
        <td class="${pnlClass(pnlPct)}">${pct(pnlPct)}</td>
        <td>${eur(pos.stop_loss)}</td>
        <td>${eur(pos.take_profit)}</td>
        <td>${(pos.opened||'').slice(0,16)}</td>
      </tr>`).join('');
    document.getElementById('okx-positions').innerHTML = `
      <table><thead><tr>
        <th>Symbol</th><th>Richtung</th><th>Hebel</th><th>Einstieg</th><th>Kurs</th>
        <th>Menge</th><th>Margin</th><th>Exposure</th><th>P&L</th><th>P&L %</th>
        <th>Stop-Loss</th><th>Take-Profit</th><th>Eröffnet</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  const trades = (okx.trades || []).slice(-20).reverse();
  if (trades.length === 0) {
    document.getElementById('okx-trades').innerHTML = '<div class="no-data">Keine Trades</div>';
  } else {
    let rows = trades.map(t => `
      <tr>
        <td>${(t.time||'').slice(0,16)}</td>
        <td><span class="badge ${t.action==='BUY'?'buy':'sell'}">${t.action}</span></td>
        <td>${t.name||t.symbol||''}</td>
        <td>${eur(t.price)}</td>
        <td>${t.leverage||''}x</td>
        <td>${eur(t.margin)}</td>
        <td class="${pnlClass(t.pnl)}">${t.pnl!=null?pnlSign(t.pnl)+eur(t.pnl):'—'}</td>
        <td>${t.reason||''}</td>
      </tr>`).join('');
    document.getElementById('okx-trades').innerHTML = `
      <table><thead><tr>
        <th>Zeit</th><th>Aktion</th><th>Symbol</th><th>Preis</th><th>Hebel</th><th>Margin</th><th>P&L</th><th>Grund</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }
}

function renderTRVirt(d) {
  const tr = d.tr_virtuell;
  if (!tr) { document.getElementById('tr-virt-summary').innerHTML = '<div class="no-data">Keine Daten</div>'; return; }

  const positionen = tr.positionen || [];
  let totalVal = 0, totalInvested = 0;
  const rows_pos = positionen.map(pos => {
    const live = d.live_prices && d.live_prices[pos.ticker] ? d.live_prices[pos.ticker] : pos.kaufkurs;
    const val = live * pos.menge;
    const inv = pos.investiert || pos.kaufkurs * pos.menge;
    const pnl = val - inv;
    const pnlPct = (pnl / inv) * 100;
    totalVal += val;
    totalInvested += inv;
    return `<tr>
      <td>${pos.asset||pos.ticker}</td>
      <td>${pos.ticker}</td>
      <td>${pos.menge.toFixed(6)}</td>
      <td>${eur(pos.kaufkurs)}</td>
      <td>${eur(live)}</td>
      <td>${eur(inv)}</td>
      <td>${eur(val)}</td>
      <td class="${pnlClass(pnl)}">${pnlSign(pnl)}${eur(pnl)}</td>
      <td class="${pnlClass(pnlPct)}">${pct(pnlPct)}</td>
      <td>${pos.kaufdatum||''}</td>
    </tr>`;
  });

  const cash = tr.kassenstand || 0;
  const start = tr.startkapital || 10000;
  const depot = totalVal + cash;
  const pnl = depot - start;
  const pnlP = (pnl / start) * 100;

  document.getElementById('tr-virt-summary').innerHTML =
    card('Depot-Wert', eur(depot), pnl >= 0 ? 'green' : 'red') +
    card('Gesamt P&L', pnlSign(pnl)+eur(pnl)+' ('+pct(pnlP)+')', pnl >= 0 ? 'green' : 'red') +
    card('Cash', eur(cash)) +
    card('Investiert', eur(totalInvested)) +
    card('Startkapital', eur(start));

  document.getElementById('tr-virt-positions').innerHTML = positionen.length === 0
    ? '<div class="no-data">Keine Positionen</div>'
    : `<table><thead><tr><th>Asset</th><th>Ticker</th><th>Menge</th><th>Kaufkurs</th><th>Kurs</th><th>Investiert</th><th>Wert</th><th>P&L</th><th>P&L %</th><th>Kaufdatum</th></tr></thead><tbody>${rows_pos.join('')}</tbody></table>`;

  const trans = (tr.transaktionen || []).slice(-10).reverse();
  document.getElementById('tr-virt-trades').innerHTML = trans.length === 0
    ? '<div class="no-data">Keine Transaktionen</div>'
    : `<table><thead><tr><th>Datum</th><th>Typ</th><th>Asset</th><th>Menge</th><th>Kurs</th><th>Betrag</th></tr></thead><tbody>`
      + trans.map(t => `<tr><td>${t.datum||''}</td><td><span class="badge ${t.typ==='Kauf'?'buy':'sell'}">${t.typ}</span></td><td>${t.asset||''}</td><td>${t.menge||''}</td><td>${eur(t.kurs)}</td><td>${eur(t.betrag)}</td></tr>`).join('')
      + '</tbody></table>';
}

function renderTRReal(d) {
  const tr = d.tr_real;
  if (!tr) { document.getElementById('tr-real-summary').innerHTML = '<div class="no-data">Keine Daten</div>'; return; }

  const nvda_eur = tr.nvda_live_eur;
  const nvda_qty = 5.269814;
  const nvda_entry = 189.80;
  const val = nvda_eur ? nvda_eur * nvda_qty : nvda_entry * nvda_qty;
  const inv = nvda_entry * nvda_qty;
  const pnl = val - inv;
  const pnlP = (pnl / inv) * 100;

  document.getElementById('tr-real-summary').innerHTML =
    card('Depot-Wert', eur(val), pnl >= 0 ? 'green' : 'red') +
    card('Gesamt P&L', pnlSign(pnl)+eur(pnl)+' ('+pct(pnlP)+')', pnl >= 0 ? 'green' : 'red') +
    card('NVDA Kurs (EUR)', eur(nvda_eur)) +
    card('EUR/USD', tr.eur_usd ? tr.eur_usd.toFixed(4) : '—');

  document.getElementById('tr-real-positions').innerHTML = `
    <table><thead><tr>
      <th>Asset</th><th>Ticker</th><th>Menge</th><th>Kaufkurs</th><th>Kurs (EUR)</th>
      <th>Investiert</th><th>Wert</th><th>P&L</th><th>P&L %</th><th>Kaufdatum</th><th>Börse</th>
    </tr></thead><tbody>
    <tr>
      <td>NVIDIA</td><td>NVDA</td><td>5.269814</td><td>€189.80</td>
      <td>${eur(nvda_eur)}</td><td>${eur(inv)}</td><td>${eur(val)}</td>
      <td class="${pnlClass(pnl)}">${pnlSign(pnl)}${eur(pnl)}</td>
      <td class="${pnlClass(pnlP)}">${pct(pnlP)}</td>
      <td>2026-05-18</td><td>Lang & Schwarz</td>
    </tr></tbody></table>`;
}

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  try {
    const r = await fetch('/api/data');
    if (!r.ok) {
      const e = await r.json();
      throw new Error(e.error || 'HTTP ' + r.status);
    }
    const data = await r.json();
    currentData = data;
    document.getElementById('loading').style.display = 'none';
    const ts = data.timestamp ? new Date(data.timestamp).toLocaleString('de-DE') : '—';
    document.getElementById('last-update').textContent = 'Stand: ' + ts;
    renderOKX(data);
    renderTRVirt(data);
    renderTRReal(data);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = '⚠ ' + e.message;
  }
}

loadData();
setInterval(loadData, 60000); // alle 60 Sek auto-refresh
</script>
</body>
</html>
