<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e6edf3;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 32px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .error {
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.4);
            border-radius: 8px;
            padding: 10px 16px;
            color: #f85149;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">📊</div>
        <h1>Trading Dashboard</h1>
        <p class="subtitle">MKraus — OKX &amp; Trade Republic</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Passwort eingeben" autofocus>
            <button type="submit">Anmelden</button>
        </form>
    </div>
</body>
</html>
